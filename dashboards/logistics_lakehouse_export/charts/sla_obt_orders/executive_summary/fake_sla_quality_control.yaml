version: 1.0.0
uuid: c8f41111-0001-4000-8000-000000000007
slice_name: "6. Fake SLA Quality Control"
viz_type: echarts_timeseries_bar
dataset_uuid: d8f41111-8888-4000-8000-000000000001
params:
  datasource: d8f41111-8888-4000-8000-000000000001__table
  viz_type: echarts_timeseries_bar
  granularity_sqla: create_date
  time_grain_sqla: P1W
  metrics:
    - expressionType: SQL
      # Giữ nhân 100.0 để ra số phần trăm trực tiếp (vd: 3.5, 4.2)
      sqlExpression: >
        COUNT(CASE WHEN time_to_complete_minutes <= 30 
             AND (is_fully_pod_compliant = FALSE OR rating_by_user < 3) 
             THEN 1 END) * 100.0 
        / NULLIF(COUNT(CASE WHEN time_to_complete_minutes <= 30 THEN 1 END), 0)
      label: "Fake SLA Rate (%)"
  groupby: []
  show_value: false

  # FIX TRIỆT ĐỂ:
  # 1. Dùng D3 float chuẩn ",.2f" (không dùng ký tự % trong format để tránh lỗi parser)
  y_axis_format: ",.2f"

  # 2. Khóa cứng trục Y từ 0 đến 10 (%) để triệt hạ điểm nhiễu và đẩy cột hiển thị rõ ràng
  y_axis_bounds: [0, 10]

  x_axis_title: "Thời gian (Tuần)"
  x_axis_title_margin: 30
  y_axis_title: "Tỷ lệ Fake SLA (%)"
  y_axis_title_margin: 40
  color_scheme: "d3Category10"
