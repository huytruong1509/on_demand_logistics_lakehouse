# ===================================================================
# 1. METRICS LAYER (Chỉ số đo lường kinh doanh & vận hành)
# ===================================================================
metrics:
  - metric_name: total_orders
    verbose_name: "Total Orders"
    metric_type: count
    expression: "COUNT(order_id)"
    description: "Tổng số lượng đơn hàng được khởi tạo"
    d3format: ",.0f"
    currency: null
    extra: null
    warning_text: null

  - metric_name: completed_orders
    verbose_name: "Completed Orders"
    metric_type: count
    expression: "COUNT(CASE WHEN order_status = 'COMPLETED' THEN 1 END)"
    description: "Tổng số lượng đơn hàng giao thành công"
    d3format: ",.0f"
    currency: null
    extra: null
    warning_text: null

  - metric_name: cancelled_orders
    verbose_name: "Cancelled Orders"
    metric_type: count
    expression: "COUNT(CASE WHEN order_status = 'CANCELLED' THEN 1 END)"
    description: "Tổng số lượng đơn hàng bị hủy"
    d3format: ",.0f"
    currency: null
    extra: null
    warning_text: null

  - metric_name: fulfillment_rate
    verbose_name: "Fulfillment Rate (%)"
    metric_type: ratio
    expression: "CAST(COUNT(CASE WHEN order_status = 'COMPLETED' THEN 1 END) AS DOUBLE) * 100.0 / NULLIF(COUNT(order_id), 0)"
    description: "Tỷ lệ giao hàng thành công (%)"
    d3format: ",.2f"
    currency: null
    extra: null
    warning_text: null

  - metric_name: cancellation_rate
    verbose_name: "Cancellation Rate (%)"
    metric_type: ratio
    expression: "CAST(COUNT(CASE WHEN order_status = 'CANCELLED' THEN 1 END) AS DOUBLE) * 100.0 / NULLIF(COUNT(order_id), 0)"
    description: "Tỷ lệ hủy đơn (%)"
    d3format: ",.2f"
    currency: null
    extra: null
    warning_text: null

  - metric_name: gross_revenue
    verbose_name: "GMV (Gross Revenue)"
    metric_type: sum
    expression: "SUM(gross_revenue)"
    description: "Tổng tổng doanh số gộp (bao gồm cả trợ giá/discount)"
    d3format: ",.0f"
    currency: VND
    extra: null
    warning_text: null

  - metric_name: net_revenue
    verbose_name: "Net Revenue"
    metric_type: sum
    expression: "SUM(net_revenue)"
    description: "Doanh thu thực nhận sau khi trừ chi phí tài xế"
    d3format: ",.0f"
    currency: VND
    extra: null
    warning_text: null

  - metric_name: total_discount
    verbose_name: "Total Discount Amount"
    metric_type: sum
    expression: "SUM(discount_amount)"
    description: "Tổng tiền khuyến mãi/voucher áp dụng"
    d3format: ",.0f"
    currency: VND
    extra: null
    warning_text: null

  - metric_name: total_cod_amount
    verbose_name: "Total COD Volume"
    metric_type: sum
    expression: "SUM(total_cod_amount)"
    description: "Tổng số tiền thu hộ (COD) luân chuyển"
    d3format: ",.0f"
    currency: VND
    extra: null
    warning_text: null

  - metric_name: avg_distance_km
    verbose_name: "Avg Distance (km)"
    metric_type: avg
    expression: "AVG(distance_km)"
    description: "Khoảng cách giao hàng trung bình per đơn"
    d3format: ",.2f"
    currency: null
    extra: null
    warning_text: null

  - metric_name: avg_accept_time_sec
    verbose_name: "Avg Accept Time (s)"
    metric_type: avg
    expression: "AVG(time_to_accept_seconds)"
    description: "Thời gian trung bình tài xế nhận đơn (giây)"
    d3format: ",.1f"
    currency: null
    extra: null
    warning_text: null

  - metric_name: avg_pickup_time_min
    verbose_name: "Avg Pickup Time (m)"
    metric_type: avg
    expression: "AVG(time_to_pickup_minutes)"
    description: "Thời gian trung bình tài xế di chuyển tới điểm lấy hàng (phút)"
    d3format: ",.1f"
    currency: null
    extra: null
    warning_text: null

  - metric_name: avg_delivery_time_min
    verbose_name: "Avg Complete Time (m)"
    metric_type: avg
    expression: "AVG(time_to_complete_minutes)"
    description: "Thời gian hoàn thành giao hàng trung bình (phút)"
    d3format: ",.1f"
    currency: null
    extra: null
    warning_text: null

  - metric_name: avg_user_rating
    verbose_name: "Avg User Rating"
    metric_type: avg
    expression: "AVG(rating_by_user)"
    description: "Đánh giá trung bình từ khách hàng (1-5 sao)"
    d3format: ",.2f"
    currency: null
    extra: null
    warning_text: null

  - metric_name: pod_compliance_rate
    verbose_name: "POD Compliance Rate (%)"
    metric_type: ratio
    expression: "CAST(COUNT(CASE WHEN is_fully_pod_compliant = TRUE THEN 1 END) AS DOUBLE) * 100.0 / NULLIF(COUNT(CASE WHEN total_pod_required > 0 THEN 1 END), 0)"
    description: "Tỷ lệ đơn hàng tuân thủ chụp ảnh xác thực giao hàng (POD)"
    d3format: ",.2f"
    currency: null
    extra: null
    warning_text: null
  - metric_name: actual_take_rate
    verbose_name: "Actual Take Rate (%)"
    metric_type: custom
    # Đo lường tỷ suất lợi nhuận thực tế
    expression: "SUM(net_revenue) * 100.0 / NULLIF(SUM(gross_revenue), 0)"
    description: "Tỷ lệ Net Revenue / Gross Revenue. Baseline an toàn: > 20%."
    d3format: ",.2f"

  - metric_name: promotion_intensity
    verbose_name: "Promo Intensity (%)"
    metric_type: custom
    # Đo lường cường độ đốt tiền khuyến mãi
    expression: "SUM(discount_amount) * 100.0 / NULLIF(SUM(gross_revenue), 0)"
    description: "Tỷ lệ chi phí Khuyến mãi trên GMV. Baseline: < 15%."
    d3format: ",.2f"

  - metric_name: profitability_per_km
    verbose_name: "Profitability per KM (VND)"
    metric_type: custom
    # Đánh giá hiệu quả kinh tế trên mỗi km vận hành (cần các trường mới update ở SQL)
    expression: "(SUM(net_revenue) - SUM(user_bonus_account) - SUM(supplier_bonus_account)) / NULLIF(SUM(distance_km), 0)"
    description: "Lợi nhuận ròng trên mỗi KM sau khi trừ mọi chi phí thưởng. Phải > 0."
    d3format: ",.0f"

  - metric_name: operational_bleeding_cod
    verbose_name: "Ops Bleeding - COD Risk"
    metric_type: custom
    # Rủi ro mất tiền thu hộ ở các đơn giao thất bại nhưng không có ảnh POD hợp lệ
    expression: "SUM(CASE WHEN order_status = 'FAILED' AND is_fully_pod_compliant = FALSE THEN total_cod_amount ELSE 0 END)"
    description: "Tổng tiền COD có rủi ro thất thoát."
    d3format: ",.0f"
    currency: VND

